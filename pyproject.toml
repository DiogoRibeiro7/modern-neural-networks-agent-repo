[tool.poetry]
name = "modern-neural-networks-lab"
version = "0.3.0"
description = "Research-grade implementations and comparisons of modern neural-network architectures."
authors = ["Diogo Ribeiro <hansolo.dj@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/DiogoRibeiro7/modern-neural-networks-agent-repo"
repository = "https://github.com/DiogoRibeiro7/modern-neural-networks-agent-repo"
documentation = "https://github.com/DiogoRibeiro7/modern-neural-networks-agent-repo/tree/main/docs"
keywords = ["neural-networks", "deep-learning", "reproducibility", "research-software", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "modern_nn_lab", from = "src" }]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/DiogoRibeiro7/modern-neural-networks-agent-repo/issues"
"Changelog" = "https://github.com/DiogoRibeiro7/modern-neural-networks-agent-repo/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = ">=2.3"
numpy = ">=1.26"
pandas = ">=2.2"
scikit-learn = ">=1.5"
scipy = ">=1.13"
matplotlib = ">=3.9"
pydantic = ">=2.7"
pyyaml = ">=6.0"
typer = ">=0.12"
rich = ">=13.7"
tabpfn = { version = ">=2.0", optional = true }

[tool.poetry.extras]
# The official TabPFN checkpoint is license-gated and must be accepted interactively;
# see src/modern_nn_lab/tracks/pfn/reference.py.
tabpfn = ["tabpfn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-cov = ">=5.0"
hypothesis = ">=6.100"
ruff = ">=0.5"
mypy = ">=1.10"
pre-commit = ">=3.7"

[tool.poetry.scripts]
modern-nn = "modern_nn_lab.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".benchmarks", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "ARG", "PL", "D"]
ignore = [
    "D100", # module docstrings are enforced by review, not by every private module
    "D104", # namespace packages carry their documentation in the track README
    "D202", # the repository separates docstring from body with a blank line by convention
    "D203", # incompatible with D211
    "D213", # incompatible with D212
    "PLR0913", # research entry points legitimately take many explicit hyperparameters
    "PLR2004", # tensor-rank and shape literals read better inline than as named constants
    "PLC0415", # heavy imports (Torch models, scikit-learn) are deferred on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "ARG"]
"scripts/*" = ["D", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
# Typer expresses CLI metadata through call-valued defaults; they are not mutable state.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 12

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*", "pandas.*", "tabpfn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src", "."]
markers = [
    "slow: experiments that take more than a few seconds",
]
filterwarnings = ["error::DeprecationWarning:modern_nn_lab.*"]

[tool.coverage.run]
branch = true
source = ["src/modern_nn_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
